name: Week 13 Flutter CI

on:
  push:
    branches: [develop, main]
    paths:
      - "13-week-13-ci-cd-automation/**"
      - ".github/workflows/week13-flutter-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "13-week-13-ci-cd-automation/**"
      - ".github/workflows/week13-flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week13-flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 13-week-13-ci-cd-automation

jobs:
  test-and-build:
    name: Verify and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check test Dart formatting
        run: dart format --output=none --set-exit-if-changed test integration_test test_driver

      - name: Analyze Dart code
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: android-builds-${{ github.run_number }}
          path: |
            13-week-13-ci-cd-automation/build/app/outputs/flutter-apk/app-release.apk
            13-week-13-ci-cd-automation/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
